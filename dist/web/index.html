<body class="start quiz">
<main class="app">
  <header class="marquee" aria-labelledby="t-top">

    </div>
  </header>

  <p class="cue" id="resume" hidden></p>

  <section class="qz" id="qz" aria-labelledby="qzQ">
    <div class="qz-top">
      <span class="qz-n" id="qzN">Pytanie 1 z 10</span>
      <button type="button" class="qz-fifty" id="qzFifty" aria-label="Koło ratunkowe 50:50: usuwa dwie błędne odpowiedzi, raz w quizie">50:50</button>
      <span class="qz-pts" id="qzPts">0 pkt</span>
    </div>
    <div class="qz-time" aria-hidden="true"><i id="qzBar"></i></div>
    <h2 class="qplate"><span class="qn" id="qzCat"></span><span class="qt" id="qzQ"></span></h2>
    <div class="answers" id="qzAns" role="group" aria-label="Odpowiedzi"></div>
    <div class="qz-fb" id="qzFb" aria-live="polite" hidden>
      <p class="qz-fbt" id="qzFbT"></p>
      <p class="qz-fbe" id="qzFbE"></p>
      <button type="button" class="qz-next" id="qzNext">Dalej →</button>
    </div>
  </section>

  <section class="qz-end" id="qzEnd" aria-labelledby="qzEndT" hidden>
    <p class="qz-kick">Koniec quizu</p>
    <h2 id="qzEndT">Masz <span id="qeOk">0</span>/10</h2>
    <p class="qz-score"><b id="qeScore">0</b> <small>pkt</small></p>
    <form class="qz-form" id="qzForm" autocomplete="off">
      <label for="qzName">Wpisz imię, żeby zapisać wynik</label>
      <input type="text" id="qzName" maxlength="20" list="qzNicks" placeholder="Twoje imię albo nick" enterkeyhint="done" required>
      <datalist id="qzNicks"></datalist>
      <button type="submit" class="btn go" id="qzSave">Zapisz wynik</button>
    </form>
    <p class="qz-note" id="qzNote" aria-live="polite"></p>
    <div class="qz-again">
      <button type="button" class="btn ghost" id="qzAgain">Zagraj jeszcze raz</button>
      <a class="btn ghost" href="wyniki.html">Lista wyników</a>
    </div>
  </section>

  <section class="scoreboard" aria-labelledby="t-top5" id="topBox" hidden>
    <div class="sb-head"><h2 id="t-top5">Czołówka</h2><span>ostatnie 30 dni</span></div>
    <ol class="board" id="top"></ol>
    <a class="sb-more" href="wyniki.html">Cały ranking →</a>
  </section>

  <p class="foot">Bez logowania. Wyniki zapisują się pod imieniem wpisanym na końcu.</p>
</main>

const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };

   Kategorie z mieszanki dostają po równo pytań i przeplatają się (w każdej rundzie w losowej kolejności).
   Dobór jak tasowanie w Spotify: nie czysto losowy, tylko według wag. Pytanie, którego nikt jeszcze nie widział,
   ma wagę 1, a ograne (niedawno albo przez kilku graczy) mniejszą, ale nigdy zerową, więc może wrócić, tylko rzadziej.
   „Ogranie” bierze się z pamięci telefonu (pk_seen_at: qid → kiedy) i z bazy dla nicków w grze (setQHist, wersja z serwerem).
   Id pytania to `kategoria:skrót treści` (qid), więc nie zmienia się po dopisaniu pytań. */
const MIX = "mix";

const mixKeys = (sel) => { const ok = (Array.isArray(sel) ? sel : []).filter((k) => LEVELS[k] && LEVELS[k].bank); return ok.length ? ok : realLevels().filter((k) => !LEVELS[k].special); };

function migrateSeen(list) {

    const m = /^([a-z]+):(\d+)-(\d+)$/.exec(id), cat = m && LEVELS[m[1]] && LEVELS[m[1]].bank && LEVELS[m[1]].bank[+m[2]], Q = cat && cat.q[+m[3]];

const DAY = 864e5, TAU_DAYS = 20, MIN_W = 0.02;
let QHIST = {};
function setQHist(h) { QHIST = h && typeof h === "object" && !Array.isArray(h) ? h : {}; }
function loadSeenAt() {

function qweight(id, seenAt, now) {

function weightedPick(items, need, w) {

/* Wybór kategorii do mieszanki: chipy pod bębnem, widoczne tylko przy „Mieszane”. Zawsze zostaje co najmniej jedna. */
function initMix(box, getSel, setSel) {
  box.innerHTML = `<span class="label" id="lbl-mix">Kategorie w mieszance</span>
    <div class="chips" role="group" aria-labelledby="lbl-mix">${realLevels().map((k) => `<button type="button" class="chip" data-k="${k}">${esc(LEVELS[k].label)}</button>`).join("")}</div>

/* Liczba pytań: suwak z przyciskami −/+ (na telefonie suwakiem trudno trafić w jedną liczbę).

/* ===================== SZYBKI QUIZ =====================

   Punkty jak w teleturnieju: +10 za dobrą odpowiedź, −1 za złą albo brak odpowiedzi. Imię pada dopiero na końcu. */
const QUIZ_KEYS = ["chajzer", "pro", "urz", "hist", "polityk", "smieszne"];

  $("#qzForm").hidden = false;
  const name = $("#qzName"); name.value = String(load("pkl_name", "") || "").slice(0, 20);
  if (!(window.PK && PK.ready())) { $("#qzForm").hidden = true; $("#qzNote").textContent = "Lista wyników jest teraz niedostępna, więc ten wynik nie zostanie zapisany."; }
  window.scrollTo({ top: 0, behavior: "auto" });
  if (!$("#qzForm").hidden) name.focus({ preventScroll: true });
}
function gameRecord(name) {
  const wrong = log.length - okCount();
  return { id: uid, mode: "teleturniej", level: "mix", code: null, questions_total: deck.length, questions_played: log.length, penalty: MINUS,
           players: [{ name, score: pts(), correct: okCount(), wrong }], qids: deck.map((q) => q.id) };
}
async function submit(e) {
  e.preventDefault();
  if (saved) return;
  const name = $("#qzName").value.trim().slice(0, 20);
  if (!name) { $("#qzNote").textContent = "Wpisz imię, żeby zapisać wynik."; $("#qzName").focus(); return; }
  const btn = $("#qzSave"), note = $("#qzNote"), mine = uid;
  btn.disabled = true; note.textContent = "Zapisuję wynik…";
  save("pkl_name", name);
  const r = await PK.submitGame(gameRecord(name));
  if (mine !== uid) return;
  if (r.ok) {
    saved = true; btn.disabled = true;
    note.innerHTML = `Zapisane! ${esc(name)}, ${num(pts())} pkt. <a href="wyniki.html?gracz=${encodeURIComponent(name)}">Zobacz swój wynik →</a>`;
    loadTop();
  } else {
    btn.disabled = false;
    note.textContent = r.why === "rejected" ? `Lista wyników odrzuciła tę grę${r.error && r.error.message ? ` (${r.error.message.replace(/^pk: /, "")})` : ""}.` : "Nie udało się zapisać wyniku. Zapisze się, gdy wróci internet, albo spróbuj jeszcze raz.";
  }
}

$("#qzAns").addEventListener("click", (e) => { const b = e.target.closest(".ans[data-k]"); if (b) answer(+b.dataset.k); });
$("#qzNext").addEventListener("click", next);
$("#qzFifty").addEventListener("click", useFifty);
$("#qzForm").addEventListener("submit", submit);
$("#qzAgain").addEventListener("click", startQuiz);
addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || "")) return;
  const k = "abcd".indexOf(e.key.toLowerCase()), d = "1234".indexOf(e.key);
  if (!$("#qz").hidden && !locked && (k >= 0 || d >= 0)) answer(k >= 0 ? k : d);
  else if (!$("#qz").hidden && (e.key === "f" || e.key === "F" || e.key === "5")) useFifty();
  else if (e.key === "Enter" && e.target === document.body && !$("#qz").hidden && locked && !$("#qzFb").hidden) next();
});

/* trwająca gra prowadzącego na tym urządzeniu: pozwól do niej wrócić */
(() => {
  try {
    const H = JSON.parse(localStorage.getItem("pkl_host") || "null"), code = JSON.parse(localStorage.getItem("pkw_hcode") || "null");
    if (H && H.deck && H.ph && H.ph !== "lobby" && H.ph !== "final" && code) {
      const r = $("#resume");
      r.innerHTML = `<span>Trwa Twoja gra · kod <b>${String(code).replace(/[^A-Z0-9]/g, "")}</b> · pytanie ${H.i + 1} z ${H.deck.length}</span><a href="live.html?tryb=prowadzacy">Wróć do gry</a>`;
      r.hidden = false;
    }
  } catch (e) { }
})();

/* czołówka listy wyników i podpowiedzi nicków */
async function loadTop() {
  if (!window.PK || !PK.ready()) return;
  const num2 = num;
  const games = (n) => n === 1 ? "gra" : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? "gry" : "gier";
  try {
    const rows = (await PK.leaderboard({ days: 30, limit: 5 })).slice(0, 5);
    if (!rows.length) return;
    const max = Math.max(1, ...rows.map((r) => +r.points));
    $("#top").innerHTML = rows.map((r, k) => `<li class="${k === 0 && +r.points > 0 ? "lead" : ""}"><span class="pos">${k + 1}.</span>
      <span class="nm"><a href="wyniki.html?gracz=${encodeURIComponent(r.name)}">${esc(r.name)}</a><span class="stat">${r.games} ${games(+r.games)} · ${r.wins} wygr.</span></span>
      <span class="p${+r.points < 0 ? " neg" : ""}">${num2(+r.points)} <small>pkt</small></span><span class="bar"><i style="width:${(Math.max(0, +r.points) / max) * 100}%"></i></span></li>`).join("");
    $("#topBox").hidden = false;
  } catch (e) { }
}
loadTop();
if (window.PK && PK.ready()) PK.nicks().then((l) => { $("#qzNicks").innerHTML = l.slice(0, 40).map((n) => `<option value="${esc(n)}">`).join(""); }).catch(() => { });

startQuiz();
</script>
